<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assistant</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header class="page-head">
        <h1 id="today">Assistant</h1>
        <p id="summary"></p>
      </header>
      <p id="auth" class="notice" hidden>
        Open Assistant Inbox from your Mac to sign in.
      </p>
      <section aria-labelledby="approvals-heading">
        <h2 id="approvals-heading">
          Approvals <span id="approval-count" class="count"></span>
        </h2>
        <p id="approvals-error" class="notice" role="status" hidden></p>
        <div id="approvals"></div>
      </section>
      <details id="history-panel">
        <summary>History</summary>
        <div id="history"></div>
      </details>
      <section aria-labelledby="todo-heading">
        <h2 id="todo-heading">To do</h2>
        <form id="capture-form" class="capture">
          <label class="sr-only" for="capture">Add to-dos, one per line</label
          ><textarea
            id="capture"
            rows="1"
            maxlength="24000"
            placeholder="Add a to-do…"
          ></textarea
          ><button id="capture-submit" type="submit">Add</button>
        </form>
        <p id="todo-error" class="notice" role="status" hidden></p>
        <ul id="todos"></ul>
      </section>
    </main>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
